<!-- Proposed list/info about all group members.  -->
<!-- Each group member gets a card, organized into Professors, Postdocs, PhD TBCs, PhD EBCs, PhD AD, PhD CMCs, etc. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My GitHub Page</title>
  <style>
    :root {
      --primary-color: #03989e;
      --bg-color: #f9f9f9;
      --text-color: #333;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 1rem 0;
      text-align: center;
    }

    nav {
      background-color: #fff;
      padding: 0.5rem;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: var(--primary-color);
      font-weight: bold;
    }


    .section {
      padding: 40px 20px;
      max-width: 800px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    footer {
      background-color: #eee;
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      margin-top: 40px;
    }
  </style>
</head>

<!-- START OF EDITABLE SECTION -->
<body>
  <section class="section" id="Professors">
    <h2>Professors</h2>
    <div class="card">
      <h3> Dr. Ping Xiao </h3>
    </div>
    <div class="card">
    <h3></h3> Dr. Ying Chen </h3>
    </div>
  </section>

</body>
</html>
